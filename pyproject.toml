[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grafana-alerts"
version = "0.1.0"
description = "Git-managed Grafana alert templates and per-organization configuration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
  "responses>=0.25,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
grafana-alerts = "grafana_alerts.cli:app"
grafana-alerts-proxy = "grafana_alerts.proxy_app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_alerts"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
