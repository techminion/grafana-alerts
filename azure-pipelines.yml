parameters:
  - name: site
    displayName: Site configuration to deploy
    type: string
    default: sbcp
  - name: rollback
    displayName: Run as an audited rollback
    type: boolean
    default: false
  - name: rollbackBuildId
    displayName: Build ID containing the deployment receipt to roll back
    type: string
    default: "0"
  - name: rollbackReason
    displayName: Reason for rollback
    type: string
    default: ""

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - templates/**
      - sites/**
      - tests/**
      - pyproject.toml
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

stages:
  - stage: Build
    displayName: Validate and render
    jobs:
      - job: ValidateAndRender
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.10"
            displayName: Use Python 3.10

          - script: >-
              python -m pip install --upgrade pip &&
              python -m pip install -e ".[dev]"
            displayName: Install dependencies

          - script: ruff check .
            displayName: Lint

          - script: pytest -q
            displayName: Test

          - script: |
              for site in sites/*.yaml; do
                grafana-alerts validate "$site"
              done
            displayName: Validate all sites

          - script: >-
              grafana-alerts render
              "sites/${{ parameters.site }}.yaml"
              --output "$(Build.ArtifactStagingDirectory)/rendered"
            displayName: Render selected site and manifest

          - ${{ if eq(parameters.rollback, true) }}:
              - task: DownloadPipelineArtifact@2
                displayName: Download source deployment receipt
                inputs:
                  buildType: specific
                  project: $(System.TeamProject)
                  definition: $(System.DefinitionId)
                  buildVersionToDownload: specific
                  pipelineId: ${{ parameters.rollbackBuildId }}
                  artifactName: deployment-receipt
                  targetPath: $(Pipeline.Workspace)/rollback-source-receipt

              - script: >-
                  grafana-alerts rollback-plan
                  "sites/${{ parameters.site }}.yaml"
                  --artifact-dir "$(Build.ArtifactStagingDirectory)/rendered"
                  --source-receipt "$(Pipeline.Workspace)/rollback-source-receipt/deployment-receipt.json"
                  --reason "$ROLLBACK_REASON"
                  --output "$(Build.ArtifactStagingDirectory)/rollback-plan"
                displayName: Plan fingerprint-bound rollback
                env:
                  GRAFANA_URL: $(GRAFANA_URL)
                  GRAFANA_TOKEN: $(GRAFANA_TOKEN)
                  ROLLBACK_REASON: ${{ parameters.rollbackReason }}

              - publish: $(Build.ArtifactStagingDirectory)/rollback-plan
                artifact: grafana-rollback-plan
                displayName: Publish reviewed rollback plan

              - publish: $(Pipeline.Workspace)/rollback-source-receipt
                artifact: rollback-source-receipt
                displayName: Republish source deployment receipt

          # Optional authenticated read. Enable with PLAN_ENABLED=true.
          - script: >-
              grafana-alerts plan
              "sites/${{ parameters.site }}.yaml"
              --artifact-dir "$(Build.ArtifactStagingDirectory)/rendered"
              --output "$(Build.ArtifactStagingDirectory)/plan"
            displayName: Compare artifact with live Grafana
            condition: >-
              and(succeeded(),
                  eq(variables['PLAN_ENABLED'], 'true'),
                  ne(variables['PRUNE_PLAN_ENABLED'], 'true'))
            env:
              GRAFANA_URL: $(GRAFANA_URL)
              GRAFANA_TOKEN: $(GRAFANA_TOKEN)

          - script: >-
              grafana-alerts plan
              "sites/${{ parameters.site }}.yaml"
              --artifact-dir "$(Build.ArtifactStagingDirectory)/rendered"
              --output "$(Build.ArtifactStagingDirectory)/plan"
              --prune
            displayName: Plan allowlisted group pruning
            condition: >-
              and(succeeded(),
                  eq(variables['PLAN_ENABLED'], 'true'),
                  eq(variables['PRUNE_PLAN_ENABLED'], 'true'))
            env:
              GRAFANA_URL: $(GRAFANA_URL)
              GRAFANA_TOKEN: $(GRAFANA_TOKEN)

          - publish: $(Build.ArtifactStagingDirectory)/rendered
            artifact: rendered-alerts
            displayName: Publish reviewed alert artifact

          - publish: $(Build.ArtifactStagingDirectory)/plan
            artifact: grafana-plan
            displayName: Publish live comparison plan
            condition: and(succeeded(), eq(variables['PLAN_ENABLED'], 'true'))

  - stage: Deploy
    displayName: Deploy reviewed artifact
    dependsOn: Build
    condition: >-
      and(succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          eq(variables['DEPLOY_ENABLED'], 'true'))
    jobs:
      - deployment: DeployAlerts
        displayName: Deploy ${{ parameters.site }} alerts
        pool:
          vmImage: ubuntu-latest
        environment: grafana-${{ parameters.site }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: rendered-alerts

                - ${{ if eq(parameters.rollback, false) }}:
                    - download: current
                      artifact: grafana-plan
                      condition: eq(variables['PRUNE_ENABLED'], 'true')

                - ${{ if eq(parameters.rollback, true) }}:
                    - download: current
                      artifact: grafana-rollback-plan

                    - download: current
                      artifact: rollback-source-receipt

                - task: UsePythonVersion@0
                  inputs:
                    versionSpec: "3.10"
                  displayName: Use Python 3.10

                - script: >-
                    python -m pip install --upgrade pip &&
                    python -m pip install .
                  displayName: Install deployment CLI

                - ${{ if eq(parameters.rollback, false) }}:
                    - script: >-
                        grafana-alerts deploy
                        "sites/${{ parameters.site }}.yaml"
                        --artifact-dir "$(Pipeline.Workspace)/rendered-alerts"
                        --receipt "$(Agent.TempDirectory)/deployment-receipt/deployment-receipt.json"
                      displayName: Verify and deploy reviewed artifact
                      condition: ne(variables['PRUNE_ENABLED'], 'true')
                      env:
                        GRAFANA_URL: $(GRAFANA_URL)
                        GRAFANA_TOKEN: $(GRAFANA_TOKEN)

                    - script: >-
                        grafana-alerts deploy
                        "sites/${{ parameters.site }}.yaml"
                        --artifact-dir "$(Pipeline.Workspace)/rendered-alerts"
                        --prune-plan "$(Pipeline.Workspace)/grafana-plan/plan.json"
                        --confirm-prune "DELETE ALLOWLISTED GROUPS"
                        --receipt "$(Agent.TempDirectory)/deployment-receipt/deployment-receipt.json"
                      displayName: Deploy artifact and prune reviewed allowlist
                      condition: eq(variables['PRUNE_ENABLED'], 'true')
                      env:
                        GRAFANA_URL: $(GRAFANA_URL)
                        GRAFANA_TOKEN: $(GRAFANA_TOKEN)
                        PRUNE_ENABLED: $(PRUNE_ENABLED)

                - ${{ if eq(parameters.rollback, true) }}:
                    - script: >-
                        grafana-alerts rollback
                        "sites/${{ parameters.site }}.yaml"
                        --artifact-dir "$(Pipeline.Workspace)/rendered-alerts"
                        --source-receipt "$(Pipeline.Workspace)/rollback-source-receipt/deployment-receipt.json"
                        --plan "$(Pipeline.Workspace)/grafana-rollback-plan/rollback-plan.json"
                        --confirm-rollback "ROLL BACK REVIEWED ARTIFACT"
                        --receipt "$(Agent.TempDirectory)/deployment-receipt/deployment-receipt.json"
                      displayName: Execute reviewed rollback
                      env:
                        GRAFANA_URL: $(GRAFANA_URL)
                        GRAFANA_TOKEN: $(GRAFANA_TOKEN)
                        ROLLBACK_ENABLED: "true"

                - publish: $(Agent.TempDirectory)/deployment-receipt
                  artifact: deployment-receipt
                  displayName: Publish deployment receipt
                  condition: always()
